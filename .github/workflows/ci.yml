name: Site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-site:
    name: HTML links, assets and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run static site checks
        run: node tools/check-site.mjs
